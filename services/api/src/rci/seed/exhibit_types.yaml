# Exhibit types for CHS Occupancy Class-II / Govt-leasehold → Class-I dockets.
# keywords: t = term (matched case-insensitively on the NFC, ASCII-digit text), w = weight.
#   title: true → when found on a short line near the top of the page it scores 3×w and marks
#   "a new document starts here". title_only: true → generic words (अर्ज, आदेश) that only count as a title. title_only: true → generic words (अर्ज, आदेश) that only count as a title. Subject lines (विषय) repeat across every letter in a docket, so
#   subject wording is deliberately not used as a signal.
# party: applicant (submitted by the society) | office (generated by revenue offices)
# default_stage: filing | query_response | internal | final
catalog_version: 1
exhibit_types:
  - code: APPLICATION
    name_en: Application for conversion
    name_mr: अर्ज
    party: applicant
    default_stage: filing
    extraction_schema: APPLICATION
    priority: 1
    keywords:
      - {t: "सविनय", w: 3}
      - {t: "विनंती", w: 2}
      - {t: "अर्जदार संस्था", w: 2}
      - {t: "अर्ज", w: 3, title: true, title_only: true}
      - {t: "application for conversion", w: 5, title: true}
    negative_keywords:
      - {t: "त्रुटी", w: 3}
      - {t: "आदेश", w: 2}
