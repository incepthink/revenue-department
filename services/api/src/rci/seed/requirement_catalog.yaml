# Requirement catalog v0 — document/process requirements seen in CHS Class-II → Class-I conversions.
# Not a statement of law: statutory backing is attached in Phase 2 via rule_requirements (verified rows).
# satisfied_by: exhibit types that satisfy the requirement.
# query_keywords: words in a query-letter item that suggest this requirement was queried.
# intake_slot: the upload slot (rci.intake.slots) that files this document at intake. Applicant documents without one
#   are recognised among the additional documents. Which of them are required comes from rule_requirements.
catalog_version: 0
