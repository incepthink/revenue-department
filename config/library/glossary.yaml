# English → Marathi search terms, applied to every GR search before the model rewrite (deterministic, case-insensitive,
# whole words). `mr` is how the term is printed in the GRs; several spellings may be listed.
terms:
  - en: ["unearned income"]
    mr: ["अनर्जित उत्पन्न", "अनर्जित रक्कम"]
  - en: ["breach", "breach of conditions", "breach of condition"]
    mr: ["शर्तभंग"]
  - en: ["regularisation", "regularization", "regularise", "regularize"]
    mr: ["नियमानुकूल"]
  - en: ["class-i", "class i", "class 1", "class-1", "occupancy class i", "free hold", "freehold"]
    mr: ["भोगवटादार वर्ग-1", "वर्ग-1"]
  - en: ["class-ii", "class ii", "class 2", "class-2"]
    mr: ["भोगवटादार वर्ग-2", "वर्ग-2"]
  - en: ["conversion", "convert"]
    mr: ["रूपांतर", "रूपांतरण"]
  - en: ["premium"]
    mr: ["अधिमूल्य"]
  - en: ["chs", "housing society", "co-operative housing society", "cooperative housing society"]
    mr: ["सहकारी गृहनिर्माण संस्था"]
  - en: ["collector"]
    mr: ["जिल्हाधिकारी"]
  - en: ["state government", "government approval", "state approval"]
    mr: ["शासनाची मान्यता", "शासन मान्यता"]
  - en: ["transfer", "unauthorised transfer", "unauthorized transfer"]
    mr: ["हस्तांतरण", "विनापरवानगी हस्तांतरण"]
  - en: ["without permission", "unauthorised", "unauthorized"]
    mr: ["विनापरवानगी"]
  - en: ["change of use"]
    mr: ["वापर बदल"]
  - en: ["market value", "ready reckoner", "asr", "annual statement of rates"]
    mr: ["बाजारमूल्य", "वार्षिक दर विवरणपत्र", "रेडी रेकनर"]
  - en: ["valuation", "land valuation"]
    mr: ["मूल्यांकन"]
  - en: ["lease", "lease renewal"]
    mr: ["भाडेपट्टा", "नूतनीकरण"]
  - en: ["redevelopment"]
    mr: ["पुनर्विकास"]
  - en: ["extension", "time extension"]
    mr: ["मुदतवाढ"]
  - en: ["corrigendum"]
    mr: ["शुद्धिपत्रक"]
  - en: ["rate", "rates", "percentage"]
    mr: ["दर", "टक्के"]
  - en: ["amount", "fee", "charges"]
    mr: ["रक्कम", "शुल्क"]
  - en: ["rules", "rule"]
    mr: ["नियम"]
  - en: ["advance possession"]
    mr: ["आगाऊ ताबा"]
  - en: ["recovery"]
    mr: ["वसुली"]
  - en: ["year", "valuation year"]
    mr: ["वर्ष"]
  - en: ["crore"]
    mr: ["कोटी"]
