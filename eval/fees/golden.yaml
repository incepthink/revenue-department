# Fee-engine golden fixtures. `expected_total` is the amount the source document shows; the engine must match it to
# the paisa (tests/test_fees.py). ALL RATES HERE ARE SYNTHETIC: the 5 % premium rate and the ASR rates are the ones
# printed on the synthetic sample dockets (eval/samples), not department figures. When real precedent challans and
# verified rates are available, add them here with their case ref, exhibit and page.
cases:
  - id: DKT-001-demand
    source: {case_ref: DKT-001, exhibit: DEMAND_LETTER, note: "ASR 2024-25 ₹73,000/sq m × 1250.50 sq m × 5 % = ₹45,64,325 (challan and order show the same)"}
    inputs: {area_sqm: "1250.50", asr_rate_per_sqm: "73000", rate_pct: "5"}
    expected_total: "4564325.00"
  - id: DKT-003-demand
    source: {case_ref: DKT-003, exhibit: DEMAND_LETTER, note: "ASR 2024-25 ₹58,000/sq m × 2100.00 sq m × 5 % = ₹60,90,000 (first challan)"}
    inputs: {area_sqm: "2100.00", asr_rate_per_sqm: "58000", rate_pct: "5"}
    expected_total: "6090000.00"
  - id: rounding-half-up-rupee
    source: {note: "constructed: 1000.33 × 51,234 × 5 % = 25,62,545.361 → ₹25,62,545"}
    inputs: {area_sqm: "1000.33", asr_rate_per_sqm: "51234", rate_pct: "5"}
    expected_total: "2562545.00"
  - id: rounding-up-to-ten
    source: {note: "constructed: same value, ROUND_UP to ₹10"}
    inputs: {area_sqm: "1000.33", asr_rate_per_sqm: "51234", rate_pct: "5", rounding: {mode: ROUND_UP, unit: "10"}}
    expected_total: "2562550.00"
  - id: half-up-at-half
    source: {note: "constructed: 1 × 1010 × 5 % = 50.50 → 51 (half up)"}
    inputs: {area_sqm: "1", asr_rate_per_sqm: "1010", rate_pct: "5"}
    expected_total: "51.00"
  - id: half-even-at-half
    source: {note: "constructed: 50.50 → 50 (banker's rounding)"}
    inputs: {area_sqm: "1", asr_rate_per_sqm: "1010", rate_pct: "5", rounding: {mode: ROUND_HALF_EVEN, unit: "1"}}
    expected_total: "50.00"
  - id: slab-minimum
    source: {note: "constructed: premium ₹500 below a ₹10,000 slab minimum"}
    inputs: {area_sqm: "10", asr_rate_per_sqm: "1000", rate_pct: "5", min_amount: "10000"}
    expected_total: "10000.00"
  - id: slab-maximum
    source: {note: "constructed: premium ₹5 crore above a ₹2.5 crore slab maximum"}
    inputs: {area_sqm: "5000", asr_rate_per_sqm: "100000", rate_pct: "10", max_amount: "25000000"}
    expected_total: "25000000.00"
  - id: rebate-half
    source: {note: "constructed: 800 × 52,300 × 5 % = ₹20,92,000, 50 % concession"}
    inputs: {area_sqm: "800", asr_rate_per_sqm: "52300", rate_pct: "5", adjustments: [{code: CONCESSION, kind: rebate, rate_pct: "50"}]}
    expected_total: "1046000.00"
  - id: interest-73-days
    source: {note: "constructed: ₹20,92,000 + 12 % p.a. for 73 days = ₹50,208"}
    inputs: {area_sqm: "800", asr_rate_per_sqm: "52300", rate_pct: "5", adjustments: [{code: LATE_INTEREST, kind: interest, rate_pct: "12", days: 73}]}
    expected_total: "2142208.00"
