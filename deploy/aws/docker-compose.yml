# Production backend on one EC2 host: Postgres + pgvector, Redis, API, worker, Caddy (HTTPS).
# The web app runs on Vercel and reaches the API through https://$RCI_API_HOST.
# Run from the repo root on the host:  docker compose -f deploy/aws/docker-compose.yml --env-file deploy/aws/.env.prod up -d --build
name: rci

x-app: &app
  build:
    context: ../..
    dockerfile: infra/docker/python.Dockerfile
  image: rci-app:latest
  env_file: .env.prod
  environment:
    RCI_DATABASE_URL: postgresql+psycopg://rci:${POSTGRES_PASSWORD}@db:5432/rci
    RCI_REDIS_URL: redis://redis:6379/0
    RCI_STORAGE_BACKEND: local
    RCI_STORAGE_LOCAL_ROOT: /data/blobs
    RCI_OUTPUT_DIR: /data/out
    RCI_PIPELINE_MODE: queue
  volumes:
    - blobs:/data/blobs
    - out:/data/out
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rci
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rci -d rci"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: schema migrations + reference data (both idempotent), before the API and worker start.
  migrate:
    <<: *app
    command: sh -c "rci migrate && rci seed"
    restart: "no"
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    command: uvicorn rci.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "*"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    command: arq worker.WorkerSettings
    working_dir: /app/services/worker
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    environment:
      RCI_API_HOST: ${RCI_API_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  blobs:
  out:
  caddydata:
